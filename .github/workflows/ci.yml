name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite needs a real PostgreSQL. Without TEST_DATABASE_URL every test that
    # touches the database skips, so a run with no database passes while asserting
    # nothing, which is worse than failing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite skips rather than fails when the database is unreachable, which is
      # right on a laptop and wrong here: a green run that asserted nothing looks
      # exactly like a green run that passed. Prove the database is there first.
      - name: Verify the test database is reachable
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sri_test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["TEST_DATABASE_URL"]
          with create_engine(url).connect() as connection:
              print(connection.execute(text("SELECT version()")).scalar())
          PY

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sri_test
        run: pytest -ra

  phi-guard:
    # Refuses the build if a raw export, a credential, or a database file was
    # committed. Defence in depth behind .gitignore, which only catches mistakes
    # nobody forced past it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for PHI bearing or secret files
        run: |
          set -euo pipefail
          offenders=$(git ls-files \
            | grep -Ei '\.(xlsx|xls|db|sqlite3?|pem|key)$|service-account.*\.json|credentials.*\.json|(^|/)\.env$' \
            || true)
          if [ -n "$offenders" ]; then
            echo "Refusing: files that may carry PHI or secrets are tracked:"
            echo "$offenders"
            exit 1
          fi
          # CSV is allowed only for clearly synthetic fixtures.
          bad_csv=$(git ls-files '*.csv' | grep -v '_SYNTHETIC\.csv$' || true)
          if [ -n "$bad_csv" ]; then
            echo "Refusing: CSV files that are not marked _SYNTHETIC are tracked:"
            echo "$bad_csv"
            exit 1
          fi
          echo "No PHI bearing or secret files tracked."
