[project]
name = "sri-practice-dashboard"
version = "0.1.0"
description = "Internal practice management dashboard for SRI Psychological Services"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored agent skill scripts are not application code and follow their own style.
extend-exclude = [".agents"]
# The pre-commit hook passes file paths to ruff explicitly, and ruff lints explicit
# paths even when they are excluded unless this is on. Without it the local gate and
# CI would disagree about .agents, which is the exact drift this repo tries to avoid.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
  # Assert is used in tests and as a type narrowing aid after an explicit check.
  "S101",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures set obviously fake credentials.
"tests/*" = ["S105", "S106"]
# Alembic writes these files. Their line lengths are not ours to police.
"migrations/versions/*" = ["E501"]
