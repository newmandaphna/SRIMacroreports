<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}{{ page_title }}{% endblock %} - SRI Practice Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <span class="app-header__mark">SRI Practice Dashboard</span>
        {% if environment != "production" %}
        <span class="pill pill--neutral">{{ environment }}</span>
        {% endif %}
        <nav class="app-header__nav" aria-label="Modules">
          <a href="/" aria-current="page">Overview</a>
        </nav>
      </div>
    </header>

    <main class="app-shell">{% block content %}{% endblock %}</main>

    {% block scripts %}{% endblock %}
  </body>
</html>
